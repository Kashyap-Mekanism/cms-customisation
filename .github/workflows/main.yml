name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# ------------------------------------------------------
# Global environment
# ------------------------------------------------------
env:
  NODE_VERSION: '24'
  PNPM_VERSION: '10'

  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ======================================================
  # CI
  # ======================================================
  ci:
    name: CI - Lint, Typecheck & Build
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup pnpm
      # --------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      # --------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --------------------------------------------------
      # Lint
      # --------------------------------------------------
      - name: Run lint
        run: pnpm lint
        continue-on-error: false

      # --------------------------------------------------
      # Type check
      # --------------------------------------------------
      - name: Run type check
        run: pnpm exec tsc --noEmit

      # --------------------------------------------------
      # Build Next.js + Payload CMS
      # --------------------------------------------------
      - name: Build application
        run: pnpm build

  # ======================================================
  # Production Deployment
  # ======================================================
  deploy:
    name: Deploy to Vercel Production
    runs-on: ubuntu-latest

    # Deploy only after CI succeeds
    needs:
      - ci

    # Only deploy main branch
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup pnpm
      # --------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: ${{ env.PNPM_VERSION }}
          run_install: false

      # --------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: pnpm

      # --------------------------------------------------
      # Install dependencies
      # --------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # --------------------------------------------------
      # Install Vercel CLI
      # --------------------------------------------------
      - name: Install Vercel CLI
        run: pnpm add --global vercel@latest

      # ==================================================
      # Pull Vercel Production Environment
      # ==================================================
      - name: Pull Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --scope="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"

      # ==================================================
      # Build using Vercel
      # ==================================================
      - name: Build Vercel production artifacts
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"

      # ==================================================
      # Deploy prebuilt artifacts
      # ==================================================
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
