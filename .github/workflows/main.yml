name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================================
  # 1. GITHUB CI BUILD
  # ==========================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup pnpm
      # --------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      # --------------------------------------------------------
      # Build application
      # --------------------------------------------------------
      - name: Build application
        run: pnpm run build


  # ==========================================================
  # 2. VERCEL BUILD + DEPLOYMENT
  # ==========================================================
  deploy:
    name: Build and Deploy to Vercel

    # Deploy only if GitHub build succeeds
    needs: build

    # Deploy only on push to main
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    # --------------------------------------------------------
    # Vercel environment variables
    #
    # GitHub Repository Secrets required:
    #
    # VERCEL_TOKEN
    # VERCEL_ORG_ID
    # VERCEL_PROJECT_ID
    # --------------------------------------------------------
    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:

      # ======================================================
      # Checkout repository
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # Setup Node.js
      # ======================================================
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # ======================================================
      # Install Vercel CLI
      # ======================================================
      - name: Install Vercel CLI
        run: |
          npm install --global vercel@59.1.3


      # ======================================================
      # Verify Vercel configuration
      # ======================================================
      - name: Verify Vercel configuration
        shell: bash
        run: |
          set -e

          echo "Checking Vercel configuration..."

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ERROR: VERCEL_TOKEN is missing"
            exit 1
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "ERROR: VERCEL_ORG_ID is missing"
            exit 1
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ERROR: VERCEL_PROJECT_ID is missing"
            exit 1
          fi

          echo "VERCEL_TOKEN: available"
          echo "VERCEL_ORG_ID: available"
          echo "VERCEL_PROJECT_ID: available"


      # ======================================================
      # Verify project identifiers safely
      # ======================================================
      - name: Verify Vercel project identifiers
        shell: bash
        run: |
          echo "Vercel Project ID prefix:"
          echo "$VERCEL_PROJECT_ID" | cut -c1-4

          echo "Vercel Organization ID prefix:"
          echo "$VERCEL_ORG_ID" | cut -c1-5

          echo "Project ID length: ${#VERCEL_PROJECT_ID}"
          echo "Organization ID length: ${#VERCEL_ORG_ID}"


      # ======================================================
      # Verify Vercel project access
      #
      # This is intentionally before `vercel pull`.
      #
      # If this step fails with:
      #
      #   Project not found
      #
      # then the problem is with:
      #
      #   VERCEL_TOKEN
      #   VERCEL_ORG_ID
      #   VERCEL_PROJECT_ID
      #   OR token/team permissions
      #
      # and NOT your application build.
      # ======================================================
      - name: Verify Vercel project access
        shell: bash
        run: |
          set -e

          echo "Checking access to Vercel project..."

          vercel project inspect "$VERCEL_PROJECT_ID" \
            --scope="$VERCEL_ORG_ID" \
            --token="$VERCEL_TOKEN"

          echo "Vercel project access verified successfully."


      # ======================================================
      # Pull Vercel production environment
      #
      # Downloads the production environment configuration
      # for the selected Vercel project.
      # ======================================================
      - name: Pull Vercel production environment
        shell: bash
        run: |
          set -e

          echo "Pulling Vercel production environment..."

          vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

          echo "Vercel production environment pulled successfully."


      # ======================================================
      # Vercel Build
      #
      # Creates Vercel's prebuilt deployment artifacts.
      # ======================================================
      - name: Build with Vercel
        shell: bash
        run: |
          set -e

          echo "Building application with Vercel..."

          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"

          echo "Vercel build completed successfully."


      # ======================================================
      # Deploy
      #
      # Deploys the artifacts generated by `vercel build`.
      # ======================================================
      - name: Deploy to Vercel
        shell: bash
        run: |
          set -e

          echo "Deploying application to Vercel..."

          vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"

          echo "Deployment completed successfully."
