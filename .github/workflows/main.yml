name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ==========================================================
# GLOBAL ENVIRONMENT
# ==========================================================
# These values must exist in:
#
# GitHub Repository
#   -> Settings
#   -> Secrets and variables
#   -> Actions
#
# Required secrets:
#
# VERCEL_TOKEN
# VERCEL_ORG_ID
# VERCEL_PROJECT_ID
#
# IMPORTANT:
#
# VERCEL_ORG_ID     = orgId from .vercel/repo.json
# VERCEL_PROJECT_ID = project id from .vercel/repo.json
#
# VERCEL_ORG_ID is NOT the Vercel User ID shown in Settings.
# ==========================================================

env:
  VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}


jobs:

  # ==========================================================
  # 1. GITHUB CI BUILD
  # ==========================================================
  build:
    name: Build Application

    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup pnpm
      # --------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      # --------------------------------------------------------
      # Build application
      # --------------------------------------------------------
      - name: Build application
        run: pnpm run build


  # ==========================================================
  # 2. VERCEL BUILD + DEPLOYMENT
  # ==========================================================
  deploy:
    name: Build and Deploy to Vercel

    # --------------------------------------------------------
    # Run only if GitHub build succeeds
    # --------------------------------------------------------
    needs: build

    # --------------------------------------------------------
    # Deploy only when pushing to main
    #
    # Pull requests will NOT deploy to production.
    # --------------------------------------------------------
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # ======================================================
      # Checkout repository
      # ======================================================
      - name: Checkout repository
        uses: actions/checkout@v4


      # ======================================================
      # Setup Node.js
      # ======================================================
      - name: Setup Node.js
      # ======================================================
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # ======================================================
      # Install Vercel CLI
      # ======================================================
      - name: Install Vercel CLI
        run: |
          npm install --global vercel@59.1.3


      # ======================================================
      # Verify Vercel secrets
      # ======================================================
      - name: Verify Vercel configuration
        shell: bash
        run: |
          set -e

          echo "Checking Vercel configuration..."

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ERROR: VERCEL_TOKEN is missing"
            exit 1
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "ERROR: VERCEL_ORG_ID is missing"
            exit 1
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ERROR: VERCEL_PROJECT_ID is missing"
            exit 1
          fi

          echo "VERCEL_TOKEN: available"
          echo "VERCEL_ORG_ID: available"
          echo "VERCEL_PROJECT_ID: available"


      # ======================================================
      # Display safe identifier information
      # ======================================================
      # We never print the complete IDs.
      # ======================================================
      - name: Verify Vercel identifiers
        shell: bash
        run: |
          echo "Project ID prefix:"
          echo "$VERCEL_PROJECT_ID" | cut -c1-4

          echo "Organization ID prefix:"
          echo "$VERCEL_ORG_ID" | cut -c1-5

          echo "Project ID length: ${#VERCEL_PROJECT_ID}"
          echo "Organization ID length: ${#VERCEL_ORG_ID}"


      # ======================================================
      # Link Vercel project
      # ======================================================
      #
      # IMPORTANT:
      #
      # --project
      #     Uses VERCEL_PROJECT_ID
      #
      # --scope
      #     Uses the TEAM SLUG:
      #
      #     kashyap-mekanisms-projects
      #
      # DO NOT use:
      #
      #     --scope="$VERCEL_ORG_ID"
      #
      # because VERCEL_ORG_ID is the team/org ID, while
      # --scope identifies the Vercel team/account scope.
      #
      # The `vercel link` command creates .vercel/project.json
      # on the GitHub runner.
      #
      # It does NOT need to be committed to GitHub.
      # ======================================================
      - name: Link Vercel project
        shell: bash
        run: |
          set -e

          echo "Linking Vercel project..."

          vercel link \
            --yes \
            --project="$VERCEL_PROJECT_ID" \
            --scope="kashyap-mekanisms-projects" \
            --token="$VERCEL_TOKEN"

          echo "Vercel project linked successfully."


      # ======================================================
      # Verify generated Vercel project configuration
      # ======================================================
      - name: Verify Vercel project link
        shell: bash
        run: |
          set -e

          if [ ! -f ".vercel/project.json" ]; then
            echo "ERROR: .vercel/project.json was not created"
            exit 1
          fi

          echo "Vercel project configuration created successfully."

          echo "Project configuration:"
          cat .vercel/project.json


      # ======================================================
      # Pull Vercel production environment
      # ======================================================
      #
      # Because the project is already linked above,
      # we do NOT need:
      #
      # --scope
      #
      # here.
      # ======================================================
      - name: Pull Vercel production environment
        shell: bash
        run: |
          set -e

          echo "Pulling Vercel production environment..."

          vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

          echo "Vercel production environment pulled successfully."


      # ======================================================
      # Build using Vercel
      # ======================================================
      #
      # --prod tells Vercel to build for production.
      # ======================================================
      - name: Build with Vercel
        shell: bash
        run: |
          set -e

          echo "Building application with Vercel..."

          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"

          echo "Vercel build completed successfully."


      # ======================================================
      # Deploy prebuilt application
      # ======================================================
      #
      # --prebuilt
      #     Deploys the artifacts generated by `vercel build`.
      #
      # --prod
      #     Deploys to production.
      # ======================================================
      - name: Deploy to Vercel
        shell: bash
        run: |
          set -e

          echo "Deploying application to Vercel..."

          vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"

          echo "Deployment completed successfully."
