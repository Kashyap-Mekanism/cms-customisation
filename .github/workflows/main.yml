name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ============================================================
# GLOBAL VERCEL CONFIGURATION
# ============================================================
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}


jobs:

  # ==========================================================
  # 1. GITHUB CI BUILD
  # ==========================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout source code
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup pnpm
      # ------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false


      # ------------------------------------------------------
      # Setup Node.js
      # ------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm


      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      # ------------------------------------------------------
      # FIRST BUILD
      #
      # Build completely inside GitHub Actions.
      # If this fails, Vercel deployment will NOT run.
      # ------------------------------------------------------
      - name: Build application
        run: pnpm run build


    # ==========================================================
  # 2. VERCEL BUILD + DEPLOY
  # ==========================================================
  deploy:
    name: Build and Deploy to Vercel

    # Run only after GitHub build succeeds
    needs: build

    # Deploy only pushes to main
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # --------------------------------------------------------
      # Install Vercel CLI
      # --------------------------------------------------------
      - name: Install Vercel CLI
        run: npm install --global vercel@latest


      # --------------------------------------------------------
      # Verify Vercel secrets
      # --------------------------------------------------------
      - name: Verify Vercel configuration
        run: |
          echo "Checking Vercel configuration..."

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ERROR: VERCEL_TOKEN is missing"
            exit 1
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "ERROR: VERCEL_ORG_ID is missing"
            exit 1
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ERROR: VERCEL_PROJECT_ID is missing"
            exit 1
          fi

          echo "VERCEL_TOKEN is available"
          echo "VERCEL_ORG_ID is available"
          echo "VERCEL_PROJECT_ID is available"


      # --------------------------------------------------------
      # Create Vercel project configuration
      #
      # This creates the .vercel directory ONLY on the
      # GitHub Actions runner.
      #
      # It is NOT committed to GitHub.
      # --------------------------------------------------------
      - name: Configure Vercel project
        run: |
          mkdir -p .vercel

          cat > .vercel/project.json <<EOF
          {
            "projectId": "$VERCEL_PROJECT_ID",
            "orgId": "$VERCEL_ORG_ID"
          }
          EOF

          echo "Vercel project configuration created"


      # --------------------------------------------------------
      # Verify generated Vercel configuration
      # --------------------------------------------------------
      - name: Verify Vercel project configuration
        run: |
          echo "Vercel project configuration:"

          cat .vercel/project.json


      # --------------------------------------------------------
      # Pull Vercel production environment
      # --------------------------------------------------------
      - name: Pull Vercel environment
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"


      # --------------------------------------------------------
      # SECOND BUILD
      #
      # Vercel builds the application.
      # --------------------------------------------------------
      - name: Build with Vercel
        run: |
          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"


      # --------------------------------------------------------
      # DEPLOY
      #
      # Runs only if Vercel build succeeds.
      # --------------------------------------------------------
      - name: Deploy to Vercel
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
