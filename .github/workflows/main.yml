name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

# ======================================================
# Global environment
# ======================================================
env:
  NODE_VERSION: "24"

  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:

  # ======================================================
  # Vercel Production Deployment
  # ======================================================
  deploy:
    name: Build & Deploy to Vercel
    runs-on: ubuntu-latest

    # ----------------------------------------------------
    # Production deployment only for push to main
    # ----------------------------------------------------
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      # --------------------------------------------------
      # Install Vercel CLI
      #
      # NOTE:
      # We are NOT installing project dependencies here.
      # Vercel will install pnpm dependencies during build.
      # --------------------------------------------------
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # --------------------------------------------------
      # Verify Vercel authentication
      # --------------------------------------------------
      - name: Verify Vercel authentication
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel whoami \
            --token="$VERCEL_TOKEN"

      # --------------------------------------------------
      # Pull Vercel production environment
      #
      # This downloads the Vercel project/environment
      # configuration required for the Vercel build.
      # --------------------------------------------------
      - name: Pull Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"

      # --------------------------------------------------
      # BUILD ON VERCEL
      #
      # No pnpm install
      # No pnpm build
      # No Next.js build
      # No Payload build
      #
      # Vercel performs the complete build.
      # --------------------------------------------------
      - name: Build on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"

      # --------------------------------------------------
      # DEPLOY PREBUILT ARTIFACTS TO VERCEL
      # --------------------------------------------------
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
