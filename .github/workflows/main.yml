name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ============================================================
# GLOBAL VERCEL CONFIGURATION
# ============================================================
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}


jobs:

  # ==========================================================
  # 1. GITHUB CI BUILD
  # ==========================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout source code
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup pnpm
      # ------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false


      # ------------------------------------------------------
      # Setup Node.js
      # ------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm


      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      # ------------------------------------------------------
      # FIRST BUILD
      #
      # Build completely inside GitHub Actions.
      # If this fails, Vercel deployment will NOT run.
      # ------------------------------------------------------
      - name: Build application
        run: pnpm run build


  # ==========================================================
  # 2. VERCEL BUILD + DEPLOYMENT
  # ==========================================================
  deploy:
    name: Build and Deploy to Vercel

    # --------------------------------------------------------
    # IMPORTANT:
    # Vercel job starts ONLY after GitHub build succeeds.
    # --------------------------------------------------------
    needs: build

    # --------------------------------------------------------
    # Only deploy a PUSH to main.
    #
    # Pull requests run the build job only.
    # --------------------------------------------------------
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    env:
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

    steps:

      # ------------------------------------------------------
      # Checkout source code
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup Node.js
      # ------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # ------------------------------------------------------
      # Install Vercel CLI
      # ------------------------------------------------------
      - name: Install Vercel CLI
        run: npm install --global vercel@latest


      # ------------------------------------------------------
      # Verify Vercel secrets
      #
      # This does NOT print the actual secret values.
      # ------------------------------------------------------
      - name: Verify Vercel configuration
        run: |
          echo "Checking Vercel configuration..."

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ERROR: VERCEL_TOKEN is missing"
            exit 1
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "ERROR: VERCEL_ORG_ID is missing"
            exit 1
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ERROR: VERCEL_PROJECT_ID is missing"
            exit 1
          fi

          echo "VERCEL_TOKEN is available"
          echo "VERCEL_ORG_ID is available"
          echo "VERCEL_PROJECT_ID is available"
          echo "Vercel configuration is ready"


      # ------------------------------------------------------
      # Pull Vercel Production Environment
      #
      # VERCEL_ORG_ID and VERCEL_PROJECT_ID are provided
      # through the environment above.
      # ------------------------------------------------------
      - name: Pull Vercel environment
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"


      # ------------------------------------------------------
      # SECOND BUILD
      #
      # This build is performed by the Vercel CLI.
      #
      # If this fails:
      #
      # GitHub Build  ✅
      # Vercel Build  ❌
      # Deployment    ⏭️ SKIPPED
      # ------------------------------------------------------
      - name: Build with Vercel
        run: |
          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"


      # ------------------------------------------------------
      # DEPLOY
      #
      # This runs ONLY when "Build with Vercel" succeeds.
      #
      # --prebuilt deploys the artifacts generated by
      # the previous "vercel build".
      # ------------------------------------------------------
      - name: Deploy to Vercel
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
