name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


jobs:

  # ==========================================================
  # 1. GITHUB CI BUILD
  # ==========================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup pnpm
      # --------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm


      # --------------------------------------------------------
      # Install dependencies
      # --------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      # --------------------------------------------------------
      # FIRST BUILD
      #
      # This build happens inside GitHub Actions.
      #
      # If this fails:
      #   GitHub Build ❌
      #   Vercel       ⏭️ SKIPPED
      # --------------------------------------------------------
      - name: Build application
        run: pnpm run build


  # ==========================================================
  # 2. VERCEL BUILD + DEPLOYMENT
  # ==========================================================
  deploy:
    name: Build and Deploy to Vercel

    # --------------------------------------------------------
    # Deploy job only starts if GitHub build succeeds
    # --------------------------------------------------------
    needs: build

    # --------------------------------------------------------
    # Only deploy pushes to main
    #
    # Pull requests only run the build job.
    # --------------------------------------------------------
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    env:

      # ------------------------------------------------------
      # Vercel credentials
      # ------------------------------------------------------

      # Vercel Access Token
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

      # Vercel account/team ID
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}

      # Vercel project ID
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}


    steps:

      # --------------------------------------------------------
      # Checkout repository
      # --------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # --------------------------------------------------------
      # Setup Node.js
      # --------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # --------------------------------------------------------
      # Install Vercel CLI
      # --------------------------------------------------------
      - name: Install Vercel CLI
        run: npm install --global vercel@59.1.3


      # --------------------------------------------------------
      # Verify Vercel credentials
      #
      # We never print the actual secret values.
      # --------------------------------------------------------
      - name: Verify Vercel configuration
        run: |
          echo "Checking Vercel configuration..."

          if [ -z "$VERCEL_TOKEN" ]; then
            echo "ERROR: VERCEL_TOKEN is missing"
            exit 1
          fi

          if [ -z "$VERCEL_ORG_ID" ]; then
            echo "ERROR: VERCEL_ORG_ID is missing"
            exit 1
          fi

          if [ -z "$VERCEL_PROJECT_ID" ]; then
            echo "ERROR: VERCEL_PROJECT_ID is missing"
            exit 1
          fi

          echo "VERCEL_TOKEN: available"
          echo "VERCEL_ORG_ID: available"
          echo "VERCEL_PROJECT_ID: available"


      # --------------------------------------------------------
      # Show safe ID information
      #
      # Does NOT expose complete IDs.
      # Useful for debugging.
      # --------------------------------------------------------
      - name: Verify Vercel project identifiers
        run: |
          echo "Project ID prefix:"
          echo "$VERCEL_PROJECT_ID" | cut -c1-4

          echo "Organization ID prefix:"
          echo "$VERCEL_ORG_ID" | cut -c1-5

          echo "Project ID length: ${#VERCEL_PROJECT_ID}"
          echo "Organization ID length: ${#VERCEL_ORG_ID}"

          - name: Verify Vercel project access
  run: |
    echo "Checking Vercel project..."

    vercel project inspect "$VERCEL_PROJECT_ID" \
      --scope="$VERCEL_ORG_ID" \
      --token="$VERCEL_TOKEN"


      # --------------------------------------------------------
      # Pull Vercel production environment
      #
      # This retrieves Vercel project settings and the
      # production environment configuration needed by
      # the Vercel CLI build.
      # --------------------------------------------------------
      - name: Pull Vercel production environment
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="$VERCEL_TOKEN"


      # --------------------------------------------------------
      # SECOND BUILD
      #
      # Vercel CLI creates the Vercel build artifacts.
      #
      # If this fails:
      #
      # GitHub Build  ✅
      # Vercel Build  ❌
      # Deployment    ⏭️ SKIPPED
      # --------------------------------------------------------
      - name: Build with Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel build \
            --prod \
            --token="$VERCEL_TOKEN"


      # --------------------------------------------------------
      # DEPLOY
      #
      # This only executes if "Build with Vercel" succeeds.
      # --------------------------------------------------------
      - name: Deploy to Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy \
            --prebuilt \
            --prod \
            --token="$VERCEL_TOKEN"
