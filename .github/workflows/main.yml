name: CI/CD

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main


# ============================================================
# VERCEL CONFIGURATION
# ============================================================
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}


jobs:

  # ==========================================================
  # 1. CI - BUILD APPLICATION
  # ==========================================================
  build:
    name: Build Application
    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout source code
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup pnpm
      # ------------------------------------------------------
      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 11
          run_install: false


      # ------------------------------------------------------
      # Setup Node.js
      # ------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm


      # ------------------------------------------------------
      # Install dependencies
      # ------------------------------------------------------
      - name: Install dependencies
        run: pnpm install --frozen-lockfile


      # ------------------------------------------------------
      # Build application
      # ------------------------------------------------------
      - name: Build application
        run: pnpm run build


  # ==========================================================
  # 2. DEPLOY TO VERCEL
  # ==========================================================
  deploy:
    name: Deploy to Vercel

    # IMPORTANT:
    # Deployment can only start when the GitHub build succeeds.
    needs: build

    # Only deploy main branch pushes.
    # Pull requests will only run the build job.
    if: >
      github.event_name == 'push' &&
      github.ref == 'refs/heads/main'

    runs-on: ubuntu-latest

    steps:

      # ------------------------------------------------------
      # Checkout source code
      # ------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4


      # ------------------------------------------------------
      # Setup Node.js
      # ------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24


      # ------------------------------------------------------
      # Install Vercel CLI
      # ------------------------------------------------------
      - name: Install Vercel CLI
        run: npm install --global vercel@latest


      # ------------------------------------------------------
      # Pull Vercel production environment
      # ------------------------------------------------------
      - name: Pull Vercel environment
        run: |
          vercel pull \
            --yes \
            --environment=production \
            --token="${{ secrets.VERCEL_TOKEN }}"


      # ------------------------------------------------------
      # Deploy to Vercel
      #
      # Vercel will perform its own build as part of deployment.
      # We intentionally DO NOT use --prebuilt because you
      # specifically want Vercel to build again.
      # ------------------------------------------------------
      - name: Deploy to Vercel
        run: |
          vercel deploy \
            --prod \
            --yes \
            --token="${{ secrets.VERCEL_TOKEN }}"
