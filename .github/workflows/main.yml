name: CI/CD

on:
  push:
    branches:
      - main

# ======================================================
# Global environment
# ======================================================
env:
  VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
  VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

jobs:
  # ======================================================
  # Production Deployment
  # ======================================================
  deploy:
    name: Deploy to Vercel
    runs-on: ubuntu-latest

    # Deploy only when code is pushed to main
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:
      # --------------------------------------------------
      # Checkout repository
      # --------------------------------------------------
      - name: Checkout code
        uses: actions/checkout@v4

      # --------------------------------------------------
      # Setup Node.js
      #
      # This Node.js is ONLY used to run the Vercel CLI.
      # GitHub does NOT build the application.
      # --------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      # --------------------------------------------------
      # Install Vercel CLI
      # --------------------------------------------------
      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      # --------------------------------------------------
      # Verify Vercel authentication
      # --------------------------------------------------
      - name: Verify Vercel authentication
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel whoami \
            --token="$VERCEL_TOKEN"

      # --------------------------------------------------
      # Build and Deploy on Vercel
      #
      # IMPORTANT:
      # Do NOT use:
      #   vercel pull
      #   vercel build
      #   vercel deploy --prebuilt
      #
      # "vercel deploy --prod" sends the source to Vercel.
      # Vercel then performs:
      #
      #   1. Install dependencies
      #   2. Read Vercel environment variables
      #   3. Setup Node.js
      #   4. Setup pnpm
      #   5. Build Next.js
      #   6. Build Payload CMS
      #   7. Deploy to production
      # --------------------------------------------------
      - name: Build and Deploy on Vercel
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          vercel deploy \
            --prod \
            --yes \
            --token="$VERCEL_TOKEN"
